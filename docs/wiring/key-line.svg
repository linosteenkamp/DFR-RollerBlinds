<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="One keypad channel. The membrane key pulls the harness to ground. At the board, a 150 ohm series resistor leads to a node with a 4.7 kilohm pull-up to 3V3 and a 100 nanofarad capacitor to ground. The node goes to the GPIO, where the internal pull-up stays enabled.">
<style>
  svg { color: #34464c; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  text { font-size: 12px; fill: currentColor; }
  .t-strong { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
  .t-muted { fill: #5b6b70; }
  .new { color: #0b7a84; }
  .new text { fill: #0b7a84; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <g id="gnd2"><line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="1.6"/><line x1="-9" y1="8" x2="9" y2="8" stroke="currentColor" stroke-width="1.6"/><line x1="-6" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="1.6"/><line x1="-3" y1="16" x2="3" y2="16" stroke="currentColor" stroke-width="1.6"/></g>
      </defs>
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <!-- key -->
        <line x1="60" y1="170" x2="60" y2="210"/>
        <line x1="60" y1="170" x2="80" y2="170"/>
        <line x1="82" y1="168" x2="116" y2="152"/>
        <line x1="120" y1="170" x2="330" y2="170"/>
        <!-- board edge -->
        <line x1="330" y1="40" x2="330" y2="300" stroke-dasharray="4 5" stroke-width="1"/>
        <line x1="330" y1="170" x2="370" y2="170"/>
        <line x1="430" y1="170" x2="760" y2="170"/>
        <!-- xiao boundary -->
        <rect x="690" y="40" width="290" height="260" rx="4" stroke-dasharray="4 5" stroke-width="1"/>
        <!-- internal pullup -->
        <line x1="760" y1="170" x2="760" y2="140"/>
        <rect x="752" y="100" width="16" height="40" stroke-dasharray="3 3"/>
        <line x1="760" y1="100" x2="760" y2="76"/>
        <line x1="748" y1="76" x2="772" y2="76"/>
        <!-- buffer -->
        <line x1="760" y1="170" x2="840" y2="170"/>
        <polygon points="840,154 840,186 870,170"/>
        <line x1="870" y1="170" x2="890" y2="170"/>
      </g>
      <circle cx="80" cy="170" r="3" fill="currentColor"/><circle cx="120" cy="170" r="3" fill="currentColor"/>
      <circle cx="760" cy="170" r="3" fill="currentColor"/>
      <use href="#gnd2" xlink:href="#gnd2" x="60" y="210"/>
      <g class="new" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="370" y="162" width="60" height="16" rx="1"/>
        <!-- pull-up -->
        <line x1="530" y1="170" x2="530" y2="140"/>
        <rect x="522" y="100" width="16" height="40" rx="1"/>
        <line x1="530" y1="100" x2="530" y2="76"/>
        <line x1="518" y1="76" x2="542" y2="76"/>
        <!-- cap -->
        <line x1="530" y1="170" x2="530" y2="210"/>
        <line x1="512" y1="210" x2="548" y2="210"/><line x1="512" y1="218" x2="548" y2="218"/>
        <line x1="530" y1="218" x2="530" y2="238"/>
      </g>
      <g class="new"><use href="#gnd2" xlink:href="#gnd2" x="530" y="238"/><circle cx="530" cy="170" r="3.5" fill="currentColor"/></g>

      <text x="100" y="140" text-anchor="middle" class="t-strong">membrane key</text>
      <text x="225" y="160" text-anchor="middle" class="t-muted">harness</text>
      <text x="225" y="196" text-anchor="middle" class="t-muted">⚡ coupled spikes from</text>
      <text x="225" y="212" text-anchor="middle" class="t-muted">STEP / motor cable</text>
      <text x="336" y="56" class="t-muted">board</text>
      <text x="336" y="70" class="t-muted">connector</text>
      <g class="new">
        <text x="400" y="152" text-anchor="middle">150 Ω</text>
        <text x="400" y="200" text-anchor="middle">series</text>
        <text x="548" y="118">4.7 kΩ</text>
        <text x="548" y="132">pull-up</text>
        <text x="558" y="218">100 nF</text>
      </g>
      <text x="530" y="66" text-anchor="middle">3V3</text>
      <text x="760" y="66" text-anchor="middle">3V3</text>
      <text x="778" y="116">10–80 kΩ</text>
      <text x="778" y="130" class="t-muted">internal,</text>
      <text x="778" y="144" class="t-muted">leave on</text>
      <text x="700" y="162">GPIO</text>
      <text x="835" y="60" text-anchor="middle" class="t-strong">ESP32-C6</text>
      <text x="894" y="166">poll</text>
      <text x="894" y="180">5 ms</text>
      <text x="894" y="194" class="t-muted">key_filter</text>
      <text x="530" y="290" text-anchor="middle" class="t-muted">R and C at the pin, with short leads</text>
    </svg>
