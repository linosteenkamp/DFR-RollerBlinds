<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="The single-wire UART of the TMC2209. XIAO D10, the UART TX, connects through 1 kilohm to the first PDN pin of the driver. XIAO D0, the UART RX, connects directly to the same pin. On the driver module, a 20 kilohm resistor pulls the pin to ground. The second PDN pin stays open.">
<style>
  svg { color: #34464c; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  text { font-size: 12px; fill: currentColor; }
  .t-strong { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
  .t-muted { fill: #5b6b70; }
  .new { color: #0b7a84; }
  .new text { fill: #0b7a84; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <g id="gnd2"><line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="1.6"/><line x1="-9" y1="8" x2="9" y2="8" stroke="currentColor" stroke-width="1.6"/><line x1="-6" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="1.6"/><line x1="-3" y1="16" x2="3" y2="16" stroke="currentColor" stroke-width="1.6"/></g>
      </defs>
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="40" y="40" width="260" height="220" rx="4" stroke-dasharray="4 5" stroke-width="1"/>
        <rect x="700" y="40" width="260" height="220" rx="4" stroke-dasharray="4 5" stroke-width="1"/>
        <!-- module pull-down R6 -->
        <line x1="800" y1="120" x2="800" y2="150"/>
        <rect x="792" y="150" width="16" height="40" rx="1"/>
        <line x1="800" y1="190" x2="800" y2="205"/>
        <line x1="700" y1="230" x2="740" y2="230"/>
      </g>
      <use href="#gnd2" x="800" y="205"/>
      <g class="new" fill="none" stroke="currentColor" stroke-width="1.8">
        <line x1="300" y1="120" x2="390" y2="120"/>
        <rect x="390" y="112" width="60" height="16" rx="1"/>
        <line x1="450" y1="120" x2="800" y2="120"/>
        <polyline points="300,200 600,200 600,120"/>
      </g>
      <g class="new"><circle cx="600" cy="120" r="3.5" fill="currentColor"/></g>
      <circle cx="800" cy="120" r="3" fill="currentColor"/>

      <text x="170" y="64" text-anchor="middle" class="t-strong">XIAO ESP32C6</text>
      <text x="290" y="124" text-anchor="end">D10 · GPIO18 · TX</text>
      <text x="290" y="204" text-anchor="end">D0 · GPIO0 · RX</text>
      <text x="830" y="64" text-anchor="middle" class="t-strong">TMC2209 V1.3</text>
      <text x="712" y="112">first PDN pin</text>
      <text x="712" y="98" class="t-muted">PDN_UART</text>
      <text x="816" y="166">20 kΩ</text>
      <text x="816" y="182" class="t-muted">R6, on the module</text>
      <text x="748" y="234" class="t-muted">second PDN pin: open</text>
      <g class="new">
        <text x="420" y="102" text-anchor="middle">1 kΩ</text>
        <text x="420" y="152" text-anchor="middle">at the XIAO end</text>
        <text x="450" y="226" text-anchor="middle">RX connects directly</text>
      </g>
      <text x="500" y="284" text-anchor="middle" class="t-muted">One wire to the driver. The 1 kΩ lets the driver set the level when it replies.</text>
    </svg>
