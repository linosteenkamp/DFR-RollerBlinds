      <text x="570" y="234" text-anchor="end">3V3</text><text x="570" y="274" text-anchor="end">18 · D10</text>
      <text x="570" y="314" text-anchor="end">20 · D9</text><text x="570" y="354" text-anchor="end">19 · D8</text><text x="570" y="394" text-anchor="end">17 · D7</text>
      <text x="604" y="234">3V3 → TMC VDD</text>
      <text x="500" y="422" text-anchor="middle" class="t-muted">pin · GPIO</text><text x="500" y="448" text-anchor="middle" class="t-muted">top view, pins in header sequence</text>
