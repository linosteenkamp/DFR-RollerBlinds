      <text x="430" y="234">D2 · 2</text><text x="430" y="274">D3 · 21</text><text x="430" y="314">D4 · 22</text><text x="430" y="354">D5 · 23</text>
      <text x="430" y="394">D6</text><text x="400" y="394" text-anchor="end" class="t-muted">empty</text>
