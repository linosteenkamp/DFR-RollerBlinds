        <rect x="820" y="30" width="150" height="50" rx="3"/>
        <rect x="610" y="35" width="110" height="45" rx="3"/>
        <line x1="820" y1="55" x2="720" y2="55"/>
        <polyline points="910,80 910,250 880,250"/>
        <polyline points="910,150 760,150"/>
        <line x1="760" y1="150" x2="760" y2="166"/>
        <line x1="746" y1="166" x2="774" y2="166"/>
        <path d="M746 176 Q760 170 774 176"/>
        <line x1="760" y1="174" x2="760" y2="190"/>
        <line x1="840" y1="150" x2="840" y2="166"/>
        <line x1="828" y1="166" x2="852" y2="166"/><line x1="828" y1="173" x2="852" y2="173"/>
        <line x1="840" y1="173" x2="840" y2="190"/>
        <polyline points="640,80 640,150 624,150"/>
        <polygon points="624,141 624,159 604,150"/>
        <line x1="602" y1="140" x2="602" y2="160"/>
        <line x1="600" y1="150" x2="580" y2="150"/>
