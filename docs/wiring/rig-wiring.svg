      <text x="530" y="526" text-anchor="middle" class="t-muted">The 1 kΩ, the 4.7 kΩ, the LED resistor and the VM capacitors are on the board.</text>
      <text x="530" y="544" text-anchor="middle" class="t-muted">The 3V3 and ⏚ of a part off the board come through its cable.</text>
    </svg>
