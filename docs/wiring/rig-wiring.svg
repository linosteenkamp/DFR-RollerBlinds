<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1060" height="560" viewBox="0 0 1060 560" role="img" aria-label="Wiring of the gearbox test rig board. The 24 V PSU supplies TMC2209 VM with a 220 microfarad and a 100 nanofarad capacitor. It also supplies a buck regulator, which supplies the XIAO 5V pin through a 1N5822 Schottky diode. XIAO D9, D8 and D7 drive EN, STEP and DIR. MS1 and MS2 go to ground. 3V3 supplies the TMC2209 VDD pin. D10 connects through 1 kilohm to the first PDN pin, and D0 reads the same pin. D1 reads a DS18B20 with a 4.7 kilohm pull-up. D2 drives an optional LED through 150 ohms. D3 reads the KW11-2 switch, wired COM to ground and NC to the pin. D4 and D5 are SDA and SCL of the AS5600. The motor connects through a 4-pin connector.">
<style>
  svg { color: #34464c; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  text { font-size: 12px; fill: currentColor; }
  .t-strong { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
  .t-muted { fill: #5b6b70; }
  .new { color: #0b7a84; }
  .new text { fill: #0b7a84; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <g id="gnd"><line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="1.6"/><line x1="-9" y1="8" x2="9" y2="8" stroke="currentColor" stroke-width="1.6"/><line x1="-6" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="1.6"/><line x1="-3" y1="16" x2="3" y2="16" stroke="currentColor" stroke-width="1.6"/></g>
      </defs>

      <!-- ===== same as the blind: power, XIAO, driver ===== -->
