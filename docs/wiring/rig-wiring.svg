        <rect x="420" y="110" width="160" height="320" rx="4"/>
        <rect x="478" y="100" width="44" height="12" rx="3"/>
        <line x1="580" y1="190" x2="600" y2="190"/>
        <line x1="580" y1="230" x2="600" y2="230"/>
        <!-- EN (hop over the UART wire), STEP, DIR -->
        <path d="M580 310 H654 A6 6 0 0 1 666 310 H700 V250 H740"/>
        <polyline points="580,350 690,350 690,400 740,400"/>
        <polyline points="580,390 670,390 670,425 740,425"/>
        <!-- TMC2209 -->
        <rect x="740" y="230" width="140" height="215" rx="3"/>
        <polyline points="740,275 726,275 726,300 740,300"/>
        <line x1="880" y1="275" x2="900" y2="275"/>
        <line x1="880" y1="400" x2="900" y2="400"/>
        <line x1="880" y1="425" x2="900" y2="425"/>
        <!-- motor connector J1 and motor -->
        <line x1="880" y1="300" x2="930" y2="300"/><line x1="880" y1="325" x2="930" y2="325"/>
        <line x1="880" y1="350" x2="930" y2="350"/><line x1="880" y1="375" x2="930" y2="375"/>
        <rect x="930" y="288" width="12" height="99" rx="1"/>
        <line x1="942" y1="300" x2="966" y2="300"/><line x1="942" y1="325" x2="966" y2="325"/>
        <line x1="942" y1="350" x2="966" y2="350"/><line x1="942" y1="375" x2="966" y2="375"/>
        <rect x="966" y="285" width="56" height="105" rx="28"/>
        <!-- LED on D2 (optional) -->
        <line x1="420" y1="230" x2="400" y2="230"/>
        <rect x="360" y="222" width="40" height="16" rx="1"/>
        <line x1="360" y1="230" x2="332" y2="230"/>
        <polygon points="330,220 330,240 308,230"/>
        <line x1="306" y1="219" x2="306" y2="241"/>
        <line x1="306" y1="230" x2="270" y2="230"/>
        <line x1="314" y1="214" x2="322" y2="206"/><line x1="324" y1="216" x2="332" y2="208"/>
        <!-- D6 stub -->
        <line x1="405" y1="390" x2="420" y2="390"/>
      </g>
      <g>
        <use href="#gnd" x="600" y="190"/>
        <use href="#gnd" x="726" y="300"/>
        <use href="#gnd" x="690" y="80"/>
        <use href="#gnd" x="950" y="80"/>
        <use href="#gnd" x="760" y="190"/>
        <use href="#gnd" x="840" y="190"/>
        <use href="#gnd" x="270" y="230"/>
      </g>
      <circle cx="910" cy="150" r="3" fill="currentColor"/>

      <!-- ===== new for the rig ===== -->
      <g class="new" fill="none" stroke="currentColor" stroke-width="1.8">
        <!-- board edge -->
        <line x1="250" y1="130" x2="250" y2="410" stroke-dasharray="4 5" stroke-width="1"/>
        <!-- UART: D10 through 1 k to the first PDN pin; tag for D0 -->
        <line x1="580" y1="270" x2="598" y2="270"/>
        <rect x="598" y="263" width="36" height="14" rx="1"/>
        <polyline points="634,270 660,270 660,325 740,325"/>
        <line x1="720" y1="325" x2="720" y2="338"/>
        <rect x="702" y="338" width="36" height="15" rx="2"/>
        <line x1="420" y1="150" x2="400" y2="150"/>
        <rect x="362" y="143" width="38" height="15" rx="2"/>
