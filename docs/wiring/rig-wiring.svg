      <text x="810" y="222" text-anchor="middle" class="t-muted">DIAG · INDEX · VREF</text>
      <text x="748" y="254">EN</text><text x="748" y="279">MS1</text><text x="748" y="304">MS2</text>
      <text x="748" y="329">PDN</text><text x="748" y="354" class="t-muted">PDN</text><text x="748" y="379" class="t-muted">CLK</text>
      <text x="748" y="404">STEP</text><text x="748" y="429">DIR</text>
      <text x="872" y="254" text-anchor="end">VM</text><text x="872" y="279" text-anchor="end">GND</text>
      <text x="872" y="304" text-anchor="end">A2</text><text x="872" y="329" text-anchor="end">A1</text>
      <text x="872" y="354" text-anchor="end">B1</text><text x="872" y="379" text-anchor="end">B2</text>
      <text x="872" y="404" text-anchor="end">VDD</text><text x="872" y="429" text-anchor="end">GND</text>
      <text x="810" y="345" text-anchor="middle" class="t-muted">open</text>
      <text x="904" y="279" class="t-muted">PSU −</text>
      <text x="904" y="404">3V3</text>
      <text x="904" y="429" class="t-muted">XIAO GND</text>
      <text x="994" y="342" text-anchor="middle" class="t-strong">M</text><text x="994" y="358" text-anchor="middle" class="t-muted">motor</text>
      <text x="954" y="293" text-anchor="middle">J1</text>
      <text x="994" y="410" text-anchor="middle" class="t-muted">unit cable</text>
      <text x="810" y="468" text-anchor="middle" class="t-strong">TMC2209 V1.3</text>
      <text x="810" y="484" text-anchor="middle" class="t-muted">top view, pins as on the card</text>
      <text x="810" y="502" text-anchor="middle" class="t-muted">MS1 · MS2 → GND: 1/8 step, UART address 0</text>

      <!-- ===== labels: new for the rig ===== -->
      <g class="new">
        <text x="616" y="256" text-anchor="middle">1 kΩ</text>
