        <circle cx="300" cy="190" r="3" fill="currentColor"/>
        <circle cx="136" cy="270" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="178" cy="270" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="40" cy="360" r="3" fill="currentColor"/>
        <use href="#gnd" x="186" y="206"/>
        <use href="#gnd" x="70" y="270"/>
        <use href="#gnd" x="40" y="360"/>
