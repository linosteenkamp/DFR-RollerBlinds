      <text x="895" y="70" text-anchor="middle" class="t-muted">LRS-50-24</text>
      <text x="665" y="55" text-anchor="middle" class="t-strong">Buck</text>
      <text x="665" y="72" text-anchor="middle" class="t-muted">24 → 5 V</text>
      <text x="770" y="48" text-anchor="middle">+24 V</text>
      <text x="648" y="118">5 V</text>
      <text x="612" y="134" text-anchor="middle">1N5822</text>
      <text x="918" y="120">+24 V</text>
      <text x="772" y="172">220 µF</text>
      <text x="772" y="186">35 V</text>
      <text x="852" y="172">100 nF</text>
      <text x="835" y="140" text-anchor="middle" class="t-muted">at the VM pin</text>

