        <text x="110" y="339">bracket 2</text>
        <text x="76" y="314">VCC</text><text x="76" y="339">GND</text><text x="76" y="364">DIR</text>
        <text x="194" y="314" text-anchor="end">SDA</text><text x="194" y="354" text-anchor="end">SCL</text>
        <text x="36" y="306" text-anchor="end">3V3</text>
        <text x="125" y="392" text-anchor="middle">4-core cable, away</text>
