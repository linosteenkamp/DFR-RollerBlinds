        <text x="164" y="178" text-anchor="end">VDD</text><text x="164" y="194" text-anchor="end">DQ</text><text x="164" y="210" text-anchor="end">GND</text>
        <text x="56" y="194">motor case</text>
        <text x="194" y="178">3V3</text>
        <text x="300" y="146" text-anchor="middle">3V3</text>
        <text x="310" y="176">4.7 kΩ</text>
        <!-- KW11-2 -->
