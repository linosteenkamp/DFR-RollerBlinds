<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Wiring for one roller blind unit, with the TMC2209 drawn in its physical pin order. The 24 V PSU feeds TMC2209 VM with a 220 microfarad and a 100 nanofarad capacitor, and feeds a buck to the XIAO 5V pin through a 1N5822 Schottky diode. XIAO D9, D8 and D7 drive EN, STEP and DIR. MS1 and MS2 go to ground. 3V3 feeds the TMC2209 VDD pin. The keypad reaches D3, D4 and D5 through an RC filter. D2 drives the LED through 150 ohms.">
