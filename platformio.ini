; PlatformIO Project Configuration — DFR-RollerBlinds
; ESP32-C6 Zigbee-router roller blind controller (Window Covering 0x0102).

[platformio]
default_envs = seeed_xiao_esp32c6_zigbee

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

[env:seeed_xiao_esp32c6_zigbee]
board = seeed_xiao_esp32c6
build_flags = -DUSE_ZIGBEE
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.zigbee"

; Bench env (identical; kept for sibling symmetry / future tweaks)
[env:seeed_xiao_esp32c6_zigbee_test]
extends = env:seeed_xiao_esp32c6_zigbee

; Gearbox test rig (bare XIAO + TMC2209 test board). No Zigbee, no keypad.
; Refer to RIG_GUIDE.md. The floor of the cruise interval goes down to 40 µs
; for the speed sweep; the blind keeps 60 µs.
[env:seeed_xiao_esp32c6_rig]
board = seeed_xiao_esp32c6
build_flags = -DRAMP_MIN_CRUISE_US=40u
board_build.cmake_extra_args = -DFW_APP=rig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.rig"
monitor_echo = yes
monitor_eol = LF

[env:native]
platform = native
framework =
test_framework = unity
build_flags = -std=c11 -Wall -Wextra -I include
build_src_filter = -<*>
test_filter =
    test_position
    test_ramp
    test_keypad
    test_key_filter
    test_press_classification
    test_trace_ring
    test_ctl
    test_rig_ctl
