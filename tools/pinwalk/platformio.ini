; Standalone bench tool — verifies the XIAO ESP32C6 D-number -> GPIO mapping
; that ../../src/main.c assumes. Deliberately separate from the main project:
; no Zigbee, no esp-zb-common, so it builds in seconds and cannot affect the
; blind firmware.
;
;   pio run -d tools/pinwalk -t upload -t monitor
;
; Flash it to a BARE XIAO — it drives seven pins as outputs.

[platformio]
default_envs = pinwalk

[env:pinwalk]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
framework = espidf
board = seeed_xiao_esp32c6
monitor_speed = 115200
